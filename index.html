<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe - PvP & AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🎮 Tic Tac Toe</h1>

    <div class="mode-select">
        <button id="pvpBtn" class="active">PvP Mode</button>
        <button id="aiBtn">Vs AI</button>
    </div>

    <div class="scoreboard">
        <p>X Wins: <span id="xScore">0</span> | 
           O Wins: <span id="oScore">0</span> | 
           Draws: <span id="drawScore">0</span></p>
    </div>

    <div class="board" id="board"></div>

    <button class="restart" id="restartBtn">Restart Game</button>


</div>

<script src="javascript.js"></script>

</body>
</html>
